<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurfHub — Fixtures &amp; Standings</title>
  <meta name="description" content="Match schedules, live scores, and tournament standings table on TurfHub." />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    /* Tournament tabs */
    .tournament-tab { padding:9px 20px; border-radius:100px; border:1.5px solid #e5e7eb; background:#fff; font-size:.85rem; font-weight:700; cursor:pointer; color:#6b7280; font-family:inherit; transition:all .15s; }
    .tournament-tab.active { background:#0d2818; border-color:#0d2818; color:#fff; }
    .tournament-tab:hover:not(.active) { border-color:#9ca3af; color:#1a1a1a; }

    /* Live banner */
    .live-banner { background:#fefce8; border:1px solid #fde68a; border-radius:12px; padding:14px 20px; display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .live-dot { width:8px; height:8px; border-radius:50%; background:#f59e0b; flex-shrink:0; animation:pulse-dot 1.5s infinite; }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.7;transform:scale(1.3)} }

    /* Tab switcher */
    .view-tabs { display:flex; gap:4px; background:#f3f4f6; border-radius:10px; padding:3px; margin-bottom:18px; width:fit-content; }
    .view-tab { padding:8px 18px; border-radius:8px; border:none; font-family:inherit; font-size:.85rem; font-weight:600; cursor:pointer; transition:all .15s; background:transparent; color:#6b7280; display:flex; align-items:center; gap:6px; }
    .view-tab.active { background:#0d2818; color:#fff; }

    /* Status filter pills */
    .filter-pill { padding:5px 16px; border-radius:100px; border:1.5px solid #e5e7eb; background:#fff; font-size:.8rem; font-weight:600; cursor:pointer; color:#6b7280; font-family:inherit; transition:all .15s; }
    .filter-pill.active { background:#1a1a1a; border-color:#1a1a1a; color:#fff; }

    /* Fixture card */
    .fixture-card { background:#fff; border:1px solid #e8ede8; border-radius:12px; padding:0; margin-bottom:10px; overflow:hidden; transition:box-shadow .2s; }
    .fixture-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.08); }
    .fix-meta-bar { padding:8px 18px; border-bottom:1px solid #f3f4f6; display:flex; align-items:center; justify-content:space-between; }
    .fix-league { font-size:.68rem; font-weight:700; color:#16a34a; text-transform:uppercase; letter-spacing:.07em; }
    .fix-round { font-size:.68rem; color:#9ca3af; font-weight:600; }
    .fix-body { padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .fix-team-name { font-weight:800; font-size:1rem; color:#1a1a1a; }
    .fix-center { text-align:center; min-width:80px; }
    .fix-vs { font-size:.85rem; font-weight:700; color:#9ca3af; }
    .fix-score { font-size:1.5rem; font-weight:900; color:#0d2818; }
    .fix-datetime { font-size:.75rem; color:#6b7280; margin-top:2px; }
    .fix-venue { font-size:.72rem; color:#9ca3af; }

    /* Standings table */
    .standings-table { width:100%; border-collapse:collapse; }
    .standings-table th { background:#0d2818; color:#fff; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:11px 14px; text-align:center; }
    .standings-table th:first-child { text-align:left; width:50px; }
    .standings-table th:nth-child(2) { text-align:left; }
    .standings-table td { padding:11px 14px; text-align:center; font-size:.85rem; border-bottom:1px solid #f3f4f6; }
    .standings-table td:nth-child(2) { text-align:left; font-weight:700; color:#1a1a1a; }
    .standings-table td.win { color:#16a34a; font-weight:700; }
    .standings-table td.loss { color:#e53935; font-weight:700; }
    .standings-table td.pts { font-weight:900; color:#1a1a1a; font-size:1rem; }
    .standings-table tr.my-team { background:rgba(126,211,33,.05); }
    .rank-badge { width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:.78rem; }
    .rank-1 { background:#fde68a; color:#92400e; }
    .rank-2 { background:#e5e7eb; color:#374151; }
    .rank-3 { background:#fed7aa; color:#9a3412; }
    .form-badge { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:5px; font-size:.65rem; font-weight:800; margin:0 1px; }
    .form-w { background:#16a34a; color:#fff; }
    .form-l { background:#e53935; color:#fff; }
    .form-d { background:#9ca3af; color:#fff; }
  </style>
</head>
<body>
  <div id="app-wrapper">
    <!-- Dynamic Sidebar rendered by layout.js -->

    <div id="main-content">
      <div id="topbar">
        <div class="topbar-title">
          <span class="topbar-heading">Fixtures &amp; Standings</span>
          <span class="topbar-sub">Match schedules, live scores, and tournament tables</span>
        </div>
        <div class="topbar-actions">
          <a href="create-tournament.html" class="btn-lime" style="font-size:.82rem;padding:7px 16px;text-decoration:none">
            ➕ Host Tournament
          </a>
        </div>
      </div>

      <div class="page-body">
        <!-- Tournament tabs dynamically populated -->
        <div id="tournaments-tabs-bar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
          <div style="font-size:.85rem;color:#9ca3af;padding:6px 0">Loading tournaments...</div>
        </div>

        <!-- Live banner (shown only if a live fixture exists) -->
        <div id="live-banner" class="live-banner" style="display:none">
          <div class="live-dot"></div>
          <span style="font-weight:700;font-size:.82rem;color:#92400e">LIVE:</span>
          <span id="live-banner-text" style="font-size:.85rem;color:#78350f;flex:1">Loading live match...</span>
          <span id="live-banner-score" style="font-weight:900;font-size:1.1rem;color:#92400e">0&ndash;0</span>
        </div>

        <!-- View tabs: Fixtures / Standings -->
        <div class="view-tabs">
          <button class="view-tab active" id="tab-fixtures-btn" onclick="showView('fixtures')">📋 Fixtures</button>
          <button class="view-tab" id="tab-standings-btn" onclick="showView('standings')">📊 Standings</button>
        </div>

        <!-- Status filter -->
        <div id="status-filters" style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">
          <button class="filter-pill active" onclick="filterStatus('all',this)">All</button>
          <button class="filter-pill" onclick="filterStatus('upcoming',this)">Upcoming</button>
          <button class="filter-pill" onclick="filterStatus('live',this)">Live</button>
          <button class="filter-pill" onclick="filterStatus('completed',this)">Completed</button>
        </div>

        <!-- FIXTURES VIEW -->
        <div id="fixtures-view">
          <div id="fixtures-container">
            <div style="text-align:center;padding:40px;color:#9ca3af;font-size:.85rem">
              Loading fixtures from database...
            </div>
          </div>
        </div>

        <!-- STANDINGS VIEW (hidden by default) -->
        <div id="standings-view" style="display:none">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h3 id="standings-title" style="font-weight:800;font-size:1rem;color:#1a1a1a">Points Table</h3>
            <div style="display:flex;align-items:center;gap:6px;font-size:.75rem;color:#6b7280">
              <span style="width:10px;height:10px;border-radius:50%;background:#7ed321;display:inline-block"></span> Registered Teams
            </div>
          </div>
          <div style="background:#fff;border:1px solid #e8ede8;border-radius:12px;overflow:hidden">
            <table class="standings-table">
              <thead>
                <tr>
                  <th>Rank</th>
                  <th>Team</th>
                  <th>P</th>
                  <th>W</th>
                  <th>D</th>
                  <th>L</th>
                  <th>GF</th>
                  <th>GA</th>
                  <th>GD</th>
                  <th>Pts</th>
                </tr>
              </thead>
              <tbody id="standings-tbody">
                <tr>
                  <td colspan="10" style="text-align:center;padding:30px;color:#9ca3af">
                    Loading points table...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="api-client.js"></script>
  <script src="auth.js"></script>
  <script src="layout.js"></script>
  <script src="page-init.js"></script>
  <script>
    let allTournaments = [];
    let activeTournamentId = 0;
    let allFixtures = [];
    let currentStatusFilter = 'all';

    (async function() {
      await initPage({ navId: 'tournaments', roles: ['captain', 'player', 'owner', 'admin'] });
      await loadTournaments();
    })();

    async function loadTournaments() {
      const tabsBar = document.getElementById('tournaments-tabs-bar');
      try {
        const res = await apiGet('tournaments/list.php');
        allTournaments = res.tournaments || [];

        if (allTournaments.length === 0) {
          tabsBar.innerHTML = '<span style="font-size:.85rem;color:#9ca3af">No tournaments found in database.</span>';
          document.getElementById('fixtures-container').innerHTML = `
            <div style="text-align:center;padding:50px 20px;color:#9ca3af">
              <div style="font-size:2.5rem;margin-bottom:8px">🏆</div>
              <div style="font-weight:700;color:#1a1a1a">No Tournaments Yet</div>
              <a href="create-tournament.html" class="btn-lime" style="display:inline-block;margin-top:12px;padding:8px 18px">
                Host First Tournament
              </a>
            </div>`;
          return;
        }

        activeTournamentId = allTournaments[0].id;

        tabsBar.innerHTML = allTournaments.map((t, idx) => `
          <button class="tournament-tab ${idx === 0 ? 'active' : ''}" onclick="selectTournament(${t.id}, this)">
            ${escapeHtml(t.name)}
          </button>
        `).join('');

        await loadFixtures(activeTournamentId);
        await loadStandings(activeTournamentId);

      } catch (err) {
        console.error('Failed to load tournaments:', err);
        tabsBar.innerHTML = '<span style="color:#dc2626;font-size:.85rem">⚠️ Failed to load tournaments.</span>';
      }
    }

    async function selectTournament(id, btn) {
      activeTournamentId = id;
      document.querySelectorAll('.tournament-tab').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      await loadFixtures(activeTournamentId);
      await loadStandings(activeTournamentId);
    }

    async function loadFixtures(tournamentId) {
      const container = document.getElementById('fixtures-container');
      container.innerHTML = '<div style="text-align:center;padding:40px;color:#9ca3af;font-size:.85rem">Loading match fixtures...</div>';

      try {
        const res = await apiGet(`fixtures/list.php?tournament_id=${tournamentId}`);
        allFixtures = res.fixtures || [];

        // Check for live match to display banner
        const liveMatch = allFixtures.find(f => (f.status || '').toLowerCase() === 'live');
        const liveBanner = document.getElementById('live-banner');
        if (liveMatch) {
          liveBanner.style.display = 'flex';
          document.getElementById('live-banner-text').textContent = `${liveMatch.home_team_name} vs ${liveMatch.away_team_name} \u2014 ${liveMatch.venue_name || 'Turf'}`;
          document.getElementById('live-banner-score').textContent = `${liveMatch.home_score} \u2013 ${liveMatch.away_score}`;
        } else {
          liveBanner.style.display = 'none';
        }

        renderFixtures();
      } catch (err) {
        console.error('Failed to load fixtures:', err);
        container.innerHTML = '<div style="text-align:center;padding:30px;color:#dc2626;font-size:.85rem">⚠️ Failed to retrieve match fixtures.</div>';
      }
    }

    function renderFixtures() {
      const container = document.getElementById('fixtures-container');
      const filtered = allFixtures.filter(f => {
        if (currentStatusFilter === 'all') return true;
        return (f.status || '').toLowerCase() === currentStatusFilter.toLowerCase();
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center;padding:40px;color:#9ca3af;background:#fff;border-radius:12px;border:1px solid #e8ede8">
            <div style="font-size:2rem;margin-bottom:8px">⚽</div>
            <div style="font-weight:700;color:#1a1a1a">No Matches Found</div>
            <div style="font-size:.78rem;color:#6b7280;margin-top:2px">No match fixtures scheduled under this filter.</div>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(f => {
        const status = (f.status || 'upcoming').toLowerCase();
        const badgeClass = status === 'live' ? 'badge-live' : (status === 'completed' ? 'badge-confirmed' : 'badge-pending');
        const statusText = status === 'live' ? 'Live Now' : (status === 'completed' ? 'Completed' : 'Upcoming');

        const scoreMarkup = status === 'upcoming' 
          ? '<div class="fix-vs">vs</div>'
          : `<div class="fix-score">${f.home_score}&ndash;${f.away_score}</div>`;

        const dateStr = f.match_date ? formatMatchTime(f.match_date) : 'Date TBD';
        const venueStr = f.venue_name ? `&#128205; ${escapeHtml(f.venue_name)}` : '&#128205; TurfHub Arena';

        return `
          <div class="fixture-card">
            <div class="fix-meta-bar">
              <span class="fix-league">${escapeHtml(f.tournament_name || 'Tournament')}</span>
              <span class="fix-round">${escapeHtml(f.round_name || 'Match')}</span>
              <span class="badge ${badgeClass} badge-dot" style="margin-left:auto">${statusText}</span>
            </div>
            <div class="fix-body">
              <div class="fix-team-name">${escapeHtml(f.home_team_name || 'TBD')}</div>
              <div class="fix-center">
                ${scoreMarkup}
                <div class="fix-datetime">${dateStr}</div>
                <div class="fix-venue">${venueStr}</div>
              </div>
              <div class="fix-team-name" style="text-align:right">${escapeHtml(f.away_team_name || 'TBD')}</div>
            </div>
          </div>`;
      }).join('');
    }

    async function loadStandings(tournamentId) {
      const tbody = document.getElementById('standings-tbody');
      const title = document.getElementById('standings-title');
      const tourn = allTournaments.find(t => t.id === tournamentId);
      if (tourn) title.textContent = `Points Table \u2014 ${tourn.name}`;

      try {
        const res = await apiGet(`fixtures/standings.php?tournament_id=${tournamentId}`);
        const standings = res.standings || [];

        if (standings.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="10" style="text-align:center;padding:30px;color:#9ca3af">
                No standings data available for this tournament yet.
              </td>
            </tr>`;
          return;
        }

        tbody.innerHTML = standings.map((s, idx) => {
          const rank = idx + 1;
          const rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
          return `
            <tr>
              <td><span class="rank-badge ${rankClass}">${rank}</span></td>
              <td>${escapeHtml(s.team_name)}</td>
              <td>${s.played}</td>
              <td class="win">${s.won}</td>
              <td>${s.drawn}</td>
              <td class="loss">${s.lost}</td>
              <td>${s.goals_for}</td>
              <td>${s.goals_against}</td>
              <td>${s.goal_diff > 0 ? '+' + s.goal_diff : s.goal_diff}</td>
              <td class="pts">${s.points}</td>
            </tr>`;
        }).join('');

      } catch (err) {
        console.error('Failed to load standings:', err);
        tbody.innerHTML = `
          <tr>
            <td colspan="10" style="text-align:center;padding:25px;color:#dc2626">
              ⚠️ Could not compute standings.
            </td>
          </tr>`;
      }
    }

    function showView(view) {
      const isFixtures = view === 'fixtures';
      document.getElementById('fixtures-view').style.display = isFixtures ? 'block' : 'none';
      document.getElementById('standings-view').style.display = isFixtures ? 'none' : 'block';
      document.getElementById('status-filters').style.display = isFixtures ? 'flex' : 'none';
      document.getElementById('tab-fixtures-btn').classList.toggle('active', isFixtures);
      document.getElementById('tab-standings-btn').classList.toggle('active', !isFixtures);
    }

    function filterStatus(status, btn) {
      currentStatusFilter = status;
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderFixtures();
    }

    function formatMatchTime(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' \u00b7 ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
