<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurfHub — Player Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    .fixture-row { display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid #f3f4f6; }
    .fixture-row:last-child { border-bottom:none; }
    .fix-date { min-width:54px; text-align:center; }
    .fix-date-day { font-size:1.2rem; font-weight:900; color:#1a1a1a; line-height:1; }
    .fix-date-month { font-size:.68rem; font-weight:600; color:#9ca3af; text-transform:uppercase; }
    .fix-team { font-weight:700; font-size:.88rem; color:#1a1a1a; }
    .fix-meta { font-size:.75rem; color:#6b7280; }
    .quick-action { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid #f3f4f6; text-decoration:none; }
    .quick-action:last-child { border-bottom:none; }
    .quick-action-left { display:flex; align-items:center; gap:10px; font-size:.85rem; font-weight:600; color:#1a1a1a; }
  </style>
</head>
<body>
  <div id="app-wrapper">
    <!-- Sidebar injected by layout.js -->

    <div id="main-content">
      <div id="topbar">
        <div class="topbar-title">
          <span class="topbar-heading">Player Dashboard</span>
          <span class="topbar-sub" id="topbar-sub"></span>
        </div>
        <div class="topbar-actions">
          <a href="turf-detail.html" class="btn-lime">Find Turfs</a>
        </div>
      </div>

      <div class="page-body">
        <!-- Stats — populated by JS -->
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background:#dbeafe">📅</div>
            <div class="stat-body">
              <div class="stat-value" id="stat-bookings">—</div>
              <div class="stat-label">My Bookings</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:#dcfce7">🏟️</div>
            <div class="stat-body">
              <div class="stat-value" id="stat-turfs">—</div>
              <div class="stat-label">Turfs Available</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:#f3e8ff">👥</div>
            <div class="stat-body">
              <div class="stat-value" id="stat-teams">—</div>
              <div class="stat-label">Teams Recruiting</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:#fef3c7">🏆</div>
            <div class="stat-body">
              <div class="stat-value" id="stat-tournaments">—</div>
              <div class="stat-label">Open Tournaments</div>
            </div>
          </div>
        </div>

        <div class="content-grid">
          <!-- My Recent Bookings -->
          <div class="content-panel">
            <div class="panel-header">
              <span class="panel-title">My Recent Bookings</span>
              <a href="player-receipts.html" class="panel-action">View All &rarr;</a>
            </div>
            <div id="bookings-list">
              <!-- JS will populate -->
            </div>
          </div>

          <!-- Right column -->
          <div style="display:flex;flex-direction:column;gap:16px">

            <!-- Available Turfs preview -->
            <div class="content-panel">
              <div class="panel-header"><span class="panel-title">Featured Turfs</span></div>
              <div id="turfs-list">
                <!-- JS will populate -->
              </div>
            </div>

            <!-- Quick Actions -->
            <div class="content-panel">
              <div class="panel-header"><span class="panel-title">Quick Actions</span></div>
              <a href="turf-detail.html" class="quick-action">
                <div class="quick-action-left"><span>🏟️</span> Find &amp; Book Turf</div>
                <span style="color:#9ca3af">&rarr;</span>
              </a>
              <a href="join-team.html" class="quick-action">
                <div class="quick-action-left"><span>👥</span> Join a Team</div>
                <span style="color:#9ca3af">&rarr;</span>
              </a>
              <a href="tournament-registration.html" class="quick-action">
                <div class="quick-action-left"><span>🏆</span> Register Tournament</div>
                <span style="color:#9ca3af">&rarr;</span>
              </a>
              <a href="player-fixtures.html" class="quick-action">
                <div class="quick-action-left"><span>📋</span> View Fixtures</div>
                <span style="color:#9ca3af">&rarr;</span>
              </a>
              <a href="player-chat.html" class="quick-action">
                <div class="quick-action-left"><span>💬</span> Team Chat</div>
                <span style="color:#9ca3af">&rarr;</span>
              </a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="api-client.js"></script>
  <script src="auth.js"></script>
  <script src="layout.js"></script>
  <script>
    (async function() {
      // 1. Auth
      const user = await initAuth('player');
      if (!user) return;

      // 2. Sidebar
      renderSidebar('dashboard', user);

      // 3. Topbar subtitle
      document.getElementById('topbar-sub').textContent = `${user.full_name} · Player`;

      // 4. Fetch all data in parallel
      try {
        const [bookingsRes, turfsRes, teamsRes, tournamentsRes] = await Promise.allSettled([
          apiGet('bookings/user-bookings.php'),
          apiGet('turfs/list.php'),
          apiGet('teams/recruiting.php'),
          apiGet('tournaments/list.php')
        ]);

        const bookings = bookingsRes.status === 'fulfilled' ? (bookingsRes.value.bookings || []) : [];
        const turfs = turfsRes.status === 'fulfilled' ? (turfsRes.value.turfs || []) : [];
        const teams = teamsRes.status === 'fulfilled' ? (teamsRes.value.teams || []) : [];
        const tournaments = tournamentsRes.status === 'fulfilled' ? (tournamentsRes.value.tournaments || []) : [];

        // ── Stats ──
        document.getElementById('stat-bookings').textContent = bookings.length;
        document.getElementById('stat-turfs').textContent = turfs.length;
        document.getElementById('stat-teams').textContent = teams.length;
        document.getElementById('stat-tournaments').textContent = tournaments.length;

        // ── My Bookings ──
        const listEl = document.getElementById('bookings-list');
        if (bookings.length === 0) {
          listEl.innerHTML = `
            <div style="text-align:center;padding:30px;color:#9ca3af;font-size:.85rem">
              No bookings yet. <a href="turf-detail.html" style="color:#7ed321;font-weight:700;text-decoration:none">Find a turf</a> to get started!
            </div>`;
        } else {
          listEl.innerHTML = bookings.slice(0, 5).map(b => {
            const dateStr = b.slot_date ? new Date(b.slot_date) : null;
            const day = dateStr ? dateStr.getDate() : '—';
            const month = dateStr ? dateStr.toLocaleString('en-US', { month: 'short' }) : '';
            const badgeClass = b.status === 'confirmed' ? 'badge-confirmed' :
                               b.status === 'rejected' ? 'badge-rejected' : 'badge-pending';
            return `
              <div class="fixture-row">
                <div class="fix-date">
                  <div class="fix-date-day">${day}</div>
                  <div class="fix-date-month">${month}</div>
                </div>
                <div style="flex:1">
                  <div class="fix-team">${b.turf_name || 'Unknown Turf'}</div>
                  <div class="fix-meta">${formatTime(b.start_time)} – ${formatTime(b.end_time)} · ${b.sport_type || ''}</div>
                </div>
                <span class="badge ${badgeClass} badge-dot">${b.status}</span>
                <div style="font-weight:800;font-size:.88rem;color:#1a1a1a">${formatBDT(b.total_price)}</div>
              </div>`;
          }).join('');
        }

        // ── Featured Turfs ──
        const turfsEl = document.getElementById('turfs-list');
        if (turfs.length === 0) {
          turfsEl.innerHTML = `
            <div style="text-align:center;padding:20px;color:#9ca3af;font-size:.85rem">
              No turfs available right now.
            </div>`;
        } else {
          turfsEl.innerHTML = turfs.slice(0, 3).map(t => `
            <a href="turf-detail.html" style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f3f4f6;text-decoration:none">
              <div style="width:44px;height:44px;border-radius:10px;background:#dcfce7;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0">🏟️</div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:700;font-size:.85rem;color:#1a1a1a">${t.name}</div>
                <div style="font-size:.72rem;color:#6b7280">${t.location || t.district || ''} · ${t.sport_type || ''}</div>
              </div>
              <div style="text-align:right">
                <div style="font-weight:800;font-size:.85rem;color:#1a1a1a">${formatBDT(t.price_per_hour || t.price_per_slot || 800)}</div>
                <div style="font-size:.68rem;color:#9ca3af">per hr</div>
              </div>
            </a>
          `).join('');
        }

      } catch (err) {
        console.error('Player dashboard error:', err);
      }
    })();
  </script>
</body>
</html>
