<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurfHub — Booking Receipts</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .receipt-card { background:#fff;border:1px solid #e8ede8;border-radius:14px;overflow:hidden;margin-bottom:12px;transition:box-shadow .2s; }
    .receipt-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.08); }
    .receipt-body { display:flex;align-items:center;gap:16px;padding:16px 20px; }
    .receipt-icon { width:44px;height:44px;border-radius:12px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0; }
    .receipt-foot { background:#fafafa;border-top:1px solid #f3f4f6;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px; }
    .filter-tab { padding:7px 18px;border-radius:100px;border:1.5px solid #e5e7eb;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;background:#fff;color:#6b7280;transition:all .15s; }
    .filter-tab.active { background:#0d2818;border-color:#0d2818;color:#fff; }
    .summary-strip { display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px; }
    .summary-card { background:#fff;border:1px solid #e8ede8;border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:4px; }
    .summary-val { font-size:1.35rem;font-weight:900;color:#0d2818; }
    .summary-lbl { font-size:.72rem;color:#6b7280;font-weight:500; }
    .btn-cancel-bk { background:none;border:none;color:#ef4444;font-size:.76rem;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .15s; }
    .btn-cancel-bk:hover { background:rgba(239,68,68,0.1); }
  </style>
</head>
<body>
<div id="app-wrapper">
  <!-- Sidebar injected by layout.js -->

  <div id="main-content">
    <div id="topbar">
      <div class="topbar-title">
        <span class="topbar-heading">Booking Receipts</span>
        <span class="topbar-sub">History of your turf bookings and payments</span>
      </div>
      <div class="topbar-actions">
        <a href="book-turf.html" class="btn-lime">+ Book a Turf</a>
      </div>
    </div>
    <div class="page-body">
      <div style="max-width: 980px; margin: 0 auto; width: 100%;">

        <!-- Summary strip -->
        <div class="summary-strip">
          <div class="summary-card">
            <div class="summary-val" id="stat-total-bookings">0</div>
            <div class="summary-lbl">Total Bookings</div>
          </div>
          <div class="summary-card">
            <div class="summary-val" id="stat-total-spent" style="color:#16a34a">৳0</div>
            <div class="summary-lbl">Total Spent</div>
          </div>
          <div class="summary-card">
            <div class="summary-val" id="stat-confirmed-count">0</div>
            <div class="summary-lbl">Confirmed</div>
          </div>
          <div class="summary-card">
            <div class="summary-val" id="stat-pending-count" style="color:#e53935">0</div>
            <div class="summary-lbl">Cancelled / Other</div>
          </div>
        </div>

        <!-- Filters -->
        <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
          <button class="filter-tab active" onclick="setFilter('all',this)">All</button>
          <button class="filter-tab" onclick="setFilter('confirmed',this)">Confirmed</button>
          <button class="filter-tab" onclick="setFilter('pending',this)">Pending</button>
          <button class="filter-tab" onclick="setFilter('cancelled',this)">Cancelled</button>
        </div>

        <!-- Receipts list — populated by JS -->
        <div id="receipts-list">
          <div style="text-align:center;padding:40px;color:#9ca3af;font-size:.85rem">
            Loading your bookings...
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="api-client.js"></script>
<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="page-init.js"></script>
<script>
  let allBookings = [];
  let currentFilter = 'all';

  (async function() {
    const user = await initPage({ navId: 'receipts', roles: ['captain', 'player', 'owner', 'admin'] });
    if (!user) return;
    await loadUserBookings();
  })();

  async function loadUserBookings() {
    const listEl = document.getElementById('receipts-list');
    try {
      const data = await apiGet('bookings/user-bookings.php');
      allBookings = data.bookings || [];
      updateSummaryStats(allBookings);
      renderBookings(allBookings);
    } catch (err) {
      console.error('Failed to load bookings:', err);
      listEl.innerHTML = `
        <div style="text-align:center;padding:40px;color:#e53935;font-size:.85rem">
          ⚠️ Failed to load bookings. Is the backend running?
        </div>`;
    }
  }

  function updateSummaryStats(bookings) {
    const totalCount = bookings.length;
    const confirmedList = bookings.filter(b => b.status === 'confirmed');
    const totalSpent = confirmedList.reduce((acc, b) => acc + (parseInt(b.total_price, 10) || 0), 0);
    const confirmedCount = confirmedList.length;
    const pendingOrCancelled = totalCount - confirmedCount;

    document.getElementById('stat-total-bookings').textContent = totalCount;
    document.getElementById('stat-total-spent').textContent = formatBDT(totalSpent);
    document.getElementById('stat-confirmed-count').textContent = confirmedCount;
    document.getElementById('stat-pending-count').textContent = pendingOrCancelled;
  }

  function renderBookings(bookings) {
    const listEl = document.getElementById('receipts-list');
    const filtered = currentFilter === 'all' 
      ? bookings 
      : bookings.filter(b => b.status === currentFilter);

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div style="text-align:center;padding:40px;background:#fff;border:1px solid #e8ede8;border-radius:14px;color:#9ca3af;font-size:.9rem">
          <div style="font-size:2.5rem;margin-bottom:12px">📋</div>
          <div style="font-weight:700;color:#1a1a1a">No bookings found</div>
          <div style="margin-top:6px;font-size:.82rem">You have no ${currentFilter !== 'all' ? currentFilter : ''} bookings recorded yet.</div>
          <div style="margin-top:16px">
            <a href="book-turf.html" class="btn-lime" style="font-size:0.8rem;padding:8px 18px">Book a Turf Now</a>
          </div>
        </div>`;
      return;
    }

    listEl.innerHTML = filtered.map(b => {
      const isConfirmed = b.status === 'confirmed';
      const isCancelled = b.status === 'cancelled';
      const statusClass = isConfirmed ? 'badge-confirmed' : isCancelled ? 'badge-rejected' : 'badge-pending';
      const iconBg = isConfirmed ? '#dcfce7' : isCancelled ? '#fee2e2' : '#fef3c7';
      const statusLabel = b.status ? (b.status.charAt(0).toUpperCase() + b.status.slice(1)) : 'Pending';
      const dateStr = b.slot_date ? formatDate(b.slot_date) : formatDate(b.created_at);
      const timeStr = b.start_time && b.end_time ?
        `${formatTime(b.start_time)} – ${formatTime(b.end_time)}` : '6:00 PM – 7:00 PM';
      const trxId = b.trx_id || `SSL-TH-${b.id}`;
      const refId = b.ref_id || `TH-${b.id}`;
      const paymentMethodStr = (b.payment_method || 'bkash').toUpperCase();

      return `
        <div class="receipt-card" data-status="${b.status}">
          <div class="receipt-body">
            <div class="receipt-icon" style="background:${iconBg}">📅</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="font-weight:800;font-size:.95rem;color:#1a1a1a">${b.turf_name || 'Turf Ground'}</span>
                <span style="font-size:.65rem;font-weight:700;background:#f3f4f6;color:#6b7280;padding:2px 8px;border-radius:4px">${b.sport_type || 'Sports'}</span>
              </div>
              <div style="font-size:.78rem;color:#6b7280;margin-top:3px">
                ${dateStr} &middot; ${timeStr} &middot; 📍 ${b.turf_location || 'Dhaka'}
              </div>
              <div style="font-size:.72rem;color:#059669;font-weight:600;margin-top:2px">
                Paid via ${paymentMethodStr} &middot; Trx: ${trxId}
              </div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-weight:900;font-size:1.1rem;color:#1a1a1a">${formatBDT(b.total_price)}</div>
              <div style="margin-top:4px"><span class="badge ${statusClass} badge-dot">${statusLabel}</span></div>
            </div>
          </div>
          <div class="receipt-foot">
            <span style="font-size:.72rem;color:#9ca3af">Ref: ${refId} &middot; Booked on ${formatDate(b.created_at)}</span>
            <div style="display:flex;align-items:center;gap:12px">
              ${isConfirmed ? `
                <button type="button" class="btn-cancel-bk" onclick="cancelBooking(${b.id}, '${b.turf_name}')">Cancel Booking</button>
              ` : ''}
              <a href="#" onclick="downloadInvoice('${refId}', '${b.turf_name}', '${b.total_price}', '${dateStr}', '${timeStr}');return false;" style="font-size:.78rem;font-weight:700;color:#0d2818;text-decoration:none">Download PDF &darr;</a>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderBookings(allBookings);
  }

  async function cancelBooking(bookingId, turfName) {
    if (!confirm(`Are you sure you want to cancel your booking at "${turfName}"? This will release the slot back for other users.`)) {
      return;
    }

    try {
      const res = await apiPost('bookings/cancel.php', { booking_id: bookingId });
      alert(res.message || 'Booking cancelled and slot released successfully!');
      await loadUserBookings();
    } catch (err) {
      alert('Failed to cancel booking: ' + (err.message || 'Unknown error'));
    }
  }

  function downloadInvoice(refId, turfName, amount, dateStr, timeStr) {
    alert(`📄 Tax Invoice Receipt [${refId}]\nTurf: ${turfName}\nAmount: ৳${amount}\nSlot: ${dateStr} (${timeStr})\n\nSimulating instant PDF download.`);
  }
</script>
</body>
</html>
