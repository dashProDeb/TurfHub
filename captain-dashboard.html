<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurfHub — Captain Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    .roster-row { display:flex; align-items:center; padding:13px 0; border-bottom:1px solid #f3f4f6; gap:14px; }
    .roster-row:last-child { border-bottom:none; }
    .player-num { width:34px; height:34px; border-radius:50%; background:#0d2818; color:#7ed321; font-weight:900; font-size:.8rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .player-stat { text-align:right; min-width:44px; }
    .player-stat-val { font-weight:700; font-size:.88rem; color:#1a1a1a; }
    .player-stat-lbl { font-size:.68rem; color:#9ca3af; }
    .match-item { padding:14px 0; border-bottom:1px solid #f3f4f6; }
    .match-item:last-child { border-bottom:none; }
    .match-league { font-size:.68rem; font-weight:700; color:#7ed321; text-transform:uppercase; letter-spacing:.07em; }
    .match-teams { font-weight:700; font-size:.92rem; color:#1a1a1a; margin:3px 0; }
    .match-teams span { font-weight:400; color:#9ca3af; font-size:.82rem; margin:0 6px; }
    .match-meta { font-size:.75rem; color:#6b7280; }
    .quick-action { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid #f3f4f6; text-decoration:none; }
    .quick-action:last-child { border-bottom:none; }
    .quick-action-left { display:flex; align-items:center; gap:10px; font-size:.85rem; font-weight:600; color:#1a1a1a; }
    .quick-action-arrow { color:#9ca3af; font-size:.9rem; }
  </style>
</head>
<body>
  <div id="app-wrapper">
    <!-- Sidebar injected by layout.js -->

    <div id="main-content">
      <!-- Topbar -->
      <div id="topbar">
        <div class="topbar-title">
          <span class="topbar-heading">Captain Dashboard</span>
          <span class="topbar-sub" id="topbar-sub"></span>
        </div>
        <div class="topbar-actions">
          <a href="book-turf.html" class="btn-lime">+ Book Turf</a>
        </div>
      </div>

      <!-- Page Body -->
      <div class="page-body">

        <!-- Stat Cards — populated by JS -->
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background:#ede9fe">👥</div>
            <div class="stat-body">
              <div class="stat-value" id="stat-squad">—</div>
              <div class="stat-label">Squad Size</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:#dbeafe">📅</div>
            <div class="stat-body">
              <div class="stat-value" id="stat-matches">—</div>
              <div class="stat-label">Upcoming Matches</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:#fef3c7">🏆</div>
            <div class="stat-body">
              <div class="stat-value" id="stat-tournaments">—</div>
              <div class="stat-label">Tournaments</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:#dcfce7">🧾</div>
            <div class="stat-body">
              <div class="stat-value" id="stat-bookings">—</div>
              <div class="stat-label">Total Bookings</div>
            </div>
          </div>
        </div>

        <!-- Main content grid -->
        <div class="content-grid">

          <!-- Team Roster — populated by JS -->
          <div class="content-panel">
            <div class="panel-header">
              <span class="panel-title">Team Roster</span>
              <a href="manage-team.html" class="btn-lime" style="font-size:.78rem;padding:7px 14px">+ Add Player</a>
            </div>
            <!-- Roster table header -->
            <div style="display:flex;align-items:center;gap:14px;padding:0 0 8px;border-bottom:2px solid #f3f4f6">
              <div style="flex:1;font-size:.7rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">Player</div>
              <div class="player-stat"><span style="font-size:.7rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">Jersey</span></div>
              <div class="player-stat"><span style="font-size:.7rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">Position</span></div>
              <div style="width:90px;text-align:center;font-size:.7rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">Status</div>
            </div>
            <div id="roster-list">
              <!-- JS will populate -->
            </div>
          </div>

          <!-- Right column -->
          <div style="display:flex;flex-direction:column;gap:16px">

            <!-- Upcoming Matches — populated by JS -->
            <div class="content-panel">
              <div class="panel-header">
                <span class="panel-title">Upcoming Matches</span>
              </div>
              <div id="matches-list">
                <!-- JS will populate -->
              </div>
              <a href="fixtures.html" style="display:block;margin-top:12px;font-size:.82rem;font-weight:700;color:#7ed321;text-decoration:none">View All Fixtures &rarr;</a>
            </div>

            <!-- Quick Actions -->
            <div class="content-panel">
              <div class="panel-header"><span class="panel-title">Quick Actions</span></div>
              <a href="book-turf.html" class="quick-action">
                <div class="quick-action-left"><span>📅</span> Book Turf Slot</div>
                <span class="quick-action-arrow">&rarr;</span>
              </a>
              <a href="tournament-registration.html" class="quick-action">
                <div class="quick-action-left"><span>🏆</span> Register for Tournament</div>
                <span class="quick-action-arrow">&rarr;</span>
              </a>
              <a href="fixtures.html" class="quick-action">
                <div class="quick-action-left"><span>📋</span> View Leaderboard</div>
                <span class="quick-action-arrow">&rarr;</span>
              </a>
              <a href="chat.html" class="quick-action">
                <div class="quick-action-left"><span>💬</span> Message Owner</div>
                <span class="quick-action-arrow">&rarr;</span>
              </a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="api-client.js"></script>
  <script src="auth.js"></script>
  <script src="layout.js"></script>
  <script>
    (async function() {
      // 1. Auth check
      const user = await initAuth('captain');
      if (!user) return;

      // 2. Render sidebar
      renderSidebar('dashboard', user);

      // 3. Topbar subtitle
      document.getElementById('topbar-sub').textContent =
        `${user.full_name} · Team Captain`;

      // 4. Fetch team data, bookings, tournaments & fixtures
      try {
        let team = null;
        let members = [];
        try {
          const teamData = await apiGet('teams/detail.php');
          team = teamData.team;
          members = team ? (team.members || []) : [];
        } catch (e) {
          // No team yet
        }

        // Fetch bookings
        let bookings = [];
        try {
          const bookingsData = await apiGet('bookings/user-bookings.php');
          bookings = bookingsData.bookings || [];
        } catch (e) { /* no bookings */ }

        // Fetch tournaments & registrations
        let tournaments = [];
        let myRegistrations = [];
        try {
          const [tournData, regData] = await Promise.all([
            apiGet('tournaments/list.php'),
            apiGet('tournaments/my-registrations.php').catch(() => ({ registrations: [] }))
          ]);
          tournaments = tournData.tournaments || [];
          myRegistrations = regData.registrations || [];
        } catch (e) { /* no tournaments */ }

        // Fetch real match fixtures from database for this squad (or all upcoming)
        let fixtures = [];
        try {
          const fixEndpoint = team ? `fixtures/list.php?team_id=${team.id}` : 'fixtures/list.php?status=upcoming';
          const fixData = await apiGet(fixEndpoint);
          fixtures = fixData.fixtures || [];
        } catch (e) { /* no fixtures */ }

        // ── Stats ──
        const upcomingFixtures = fixtures.filter(f => f.status === 'upcoming' || f.status === 'live');
        document.getElementById('stat-squad').textContent = members.length || 0;
        document.getElementById('stat-matches').textContent = upcomingFixtures.length;
        document.getElementById('stat-tournaments').textContent = myRegistrations.length > 0 ? myRegistrations.length : tournaments.length;
        document.getElementById('stat-bookings').textContent = bookings.length;

        // ── Team Roster ──
        const rosterEl = document.getElementById('roster-list');
        if (members.length === 0) {
          rosterEl.innerHTML = `
            <div style="text-align:center;padding:30px;color:#9ca3af;font-size:.85rem">
              No team members yet. <a href="manage-team.html" style="color:#7ed321;font-weight:700;text-decoration:none">Add players to squad</a>
            </div>`;
        } else {
          rosterEl.innerHTML = members.map(m => {
            const statusClass = m.status === 'active' ? 'badge-available' :
                                m.status === 'injured' ? 'badge-unavailable' : 'badge-uncertain';
            const statusLabel = m.status ? m.status.charAt(0).toUpperCase() + m.status.slice(1) : 'Active';
            return `
              <div class="roster-row">
                <div class="player-num">#${m.jersey_number || '?'}</div>
                <div style="flex:1">
                  <div style="font-weight:700;font-size:.88rem">${m.full_name}</div>
                  <div style="font-size:.75rem;color:#9ca3af">${m.position || 'Player'}</div>
                </div>
                <div class="player-stat">
                  <div class="player-stat-val">${m.jersey_number || '—'}</div>
                  <div class="player-stat-lbl">Jersey</div>
                </div>
                <div class="player-stat">
                  <div class="player-stat-val">${m.position || '—'}</div>
                  <div class="player-stat-lbl">Position</div>
                </div>
                <div style="width:90px;text-align:center">
                  <span class="badge ${statusClass} badge-dot">${statusLabel}</span>
                </div>
              </div>`;
          }).join('');
        }

        // ── Upcoming Tournament Matches (from database fixtures) ──
        const matchesEl = document.getElementById('matches-list');
        if (fixtures.length === 0) {
          // If no fixtures, show upcoming booking slots as fallback
          const upcomingBookings = bookings.filter(b => b.slot_date && new Date(b.slot_date) >= new Date()).slice(0, 3);
          if (upcomingBookings.length === 0) {
            matchesEl.innerHTML = `
              <div style="text-align:center;padding:24px 10px;color:#9ca3af;font-size:.85rem">
                No upcoming fixtures scheduled.<br>
                <a href="tournament-registration.html" style="color:#7ed321;font-weight:700;text-decoration:none;display:inline-block;margin-top:6px">Enter a Tournament &rarr;</a>
              </div>`;
          } else {
            matchesEl.innerHTML = upcomingBookings.map(b => `
              <div class="match-item">
                <div class="match-league">${b.sport_type || 'Practice Match'}</div>
                <div class="match-teams">${b.turf_name || 'Turf Pitch'}</div>
                <div class="match-meta">${formatDate(b.slot_date)} &middot; ${formatTime(b.start_time)} – ${formatTime(b.end_time)}</div>
              </div>
            `).join('');
          }
        } else {
          matchesEl.innerHTML = fixtures.slice(0, 3).map(f => {
            const isLive = f.status === 'live';
            const statusBadge = isLive 
              ? '<span class="badge badge-live badge-dot" style="font-size:.65rem">LIVE</span>' 
              : (f.status === 'completed' ? '<span class="badge badge-confirmed" style="font-size:.65rem">FT</span>' : '');

            return `
              <div class="match-item">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <div class="match-league">${escapeHtml(f.tournament_name || 'Tournament Match')}</div>
                  ${statusBadge}
                </div>
                <div class="match-teams">
                  ${escapeHtml(f.home_team_name || 'Home')} <span>vs</span> ${escapeHtml(f.away_team_name || 'Away')}
                  ${isLive ? `<strong style="color:#b45309;margin-left:6px">${f.home_score} - ${f.away_score}</strong>` : ''}
                </div>
                <div class="match-meta">
                  ${f.match_date ? formatDate(f.match_date.split(' ')[0]) : 'Date TBD'} &middot; 📍 ${escapeHtml(f.venue_name || 'Turf Ground')}
                </div>
              </div>`;
          }).join('');
        }

      } catch (err) {
        console.error('Captain dashboard error:', err);
        document.getElementById('roster-list').innerHTML = `
          <div style="text-align:center;padding:30px;color:#e53935;font-size:.85rem">
            ⚠️ Failed to load data. Is the backend running?
          </div>`;
      }
    })();

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
