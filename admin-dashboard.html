<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurfHub — Platform Admin Overview</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    .kpi-trend { font-size: .75rem; font-weight: 700; margin-top: 4px; }
    .kpi-trend.up { color: #16a34a; }
    .kpi-trend.warning { color: #d97706; }
    
    .table-custom { width: 100%; border-collapse: collapse; text-align: left; font-size: .85rem; }
    .table-custom th { background: #0d2818; color: #fff; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 12px 16px; }
    .table-custom td { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; color: #374151; }
    .table-custom tr:last-child td { border-bottom: none; }
    .table-custom tr:hover { background: #fbfdf9; }
  </style>
</head>
<body>
<div id="app-wrapper">
  <!-- Sidebar injected by layout.js -->

  <div id="main-content">
    
    <!-- Topbar -->
    <div id="topbar">
      <div class="topbar-title">
        <span class="topbar-heading">Platform Admin Dashboard</span>
        <span class="topbar-sub">System health, business intelligence, and verification queues</span>
      </div>
      <div class="topbar-actions">
        <a href="admin-approvals.html" class="btn-lime" style="font-size:.82rem;padding:7px 16px;text-decoration:none" id="pending-btn">
          ⚡ Loading...
        </a>
      </div>
    </div>

    <!-- Page Body -->
    <div class="page-body">
      
      <!-- 4 Top KPI Cards — populated by JS -->
      <div class="stat-grid" style="margin-bottom:24px">
        <div class="stat-card">
          <div class="stat-icon" style="background:#dcfce7">💵</div>
          <div class="stat-body">
            <div class="stat-value" id="kpi-revenue">—</div>
            <div class="stat-label">Total Platform Revenue</div>
            <div class="kpi-trend up" id="kpi-monthly-rev"></div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background:#dbeafe">📅</div>
          <div class="stat-body">
            <div class="stat-value" id="kpi-bookings">—</div>
            <div class="stat-label">Total Bookings</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background:#f3e8ff">👥</div>
          <div class="stat-body">
            <div class="stat-value" id="kpi-users">—</div>
            <div class="stat-label">Registered Users</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background:#fef3c7">🏟️</div>
          <div class="stat-body">
            <div class="stat-value" id="kpi-turfs">—</div>
            <div class="stat-label">Active Turfs</div>
            <div class="kpi-trend warning" id="kpi-pending-approvals"></div>
          </div>
        </div>
      </div>

      <!-- Recent Bookings Table — populated by JS -->
      <div class="content-panel" style="padding:22px">
        <div class="panel-header" style="margin-bottom:16px">
          <div>
            <span class="panel-title">Recent Bookings</span>
            <span style="display:block;font-size:.78rem;color:#6b7280;margin-top:2px">Latest platform transactions</span>
          </div>
          <a href="admin-reports.html" class="panel-action">Full Reports &rarr;</a>
        </div>

        <div style="overflow-x:auto">
          <table class="table-custom">
            <thead>
              <tr>
                <th>TRX ID</th>
                <th>Customer</th>
                <th>Turf</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="bookings-tbody">
              <tr>
                <td colspan="6" style="text-align:center;padding:30px;color:#9ca3af">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="api-client.js"></script>
<script src="auth.js"></script>
<script src="layout.js"></script>
<script>
  (async function() {
    // 1. Auth
    const user = await initAuth('admin');
    if (!user) return;

    // 2. Sidebar
    renderSidebar('overview', user);

    // 3. Fetch dashboard stats from backend
    try {
      const stats = await apiGet('admin/dashboard-stats.php');

      // ── KPI Cards ──
      document.getElementById('kpi-revenue').textContent = formatBDT(stats.total_revenue);
      document.getElementById('kpi-monthly-rev').textContent =
        `This month: ${formatBDT(stats.monthly_revenue)}`;
      document.getElementById('kpi-bookings').textContent =
        Number(stats.total_bookings).toLocaleString();
      document.getElementById('kpi-users').textContent =
        Number(stats.total_users).toLocaleString();
      document.getElementById('kpi-turfs').textContent = stats.total_turfs;
      document.getElementById('kpi-pending-approvals').textContent =
        stats.pending_approvals > 0
          ? `${stats.pending_approvals} Pending Verification`
          : 'All Verified';

      // Pending approvals button
      document.getElementById('pending-btn').textContent =
        `⚡ ${stats.pending_approvals} Pending Approvals`;

      // ── Recent Bookings Table ──
      const tbody = document.getElementById('bookings-tbody');
      const bookings = stats.recent_bookings || [];

      if (bookings.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align:center;padding:30px;color:#9ca3af">No bookings yet</td>
          </tr>`;
      } else {
        tbody.innerHTML = bookings.map(b => {
          const badgeClass = b.status === 'confirmed' ? 'badge-confirmed' :
                             b.status === 'pending' ? 'badge-pending' : 'badge-rejected';
          const statusLabel = b.status.charAt(0).toUpperCase() + b.status.slice(1);
          return `
            <tr>
              <td><code style="font-size:.78rem;background:#f3f4f6;padding:2px 8px;border-radius:6px">${b.trx_id || '—'}</code></td>
              <td style="font-weight:600">${b.customer_name}</td>
              <td>${b.turf_name}</td>
              <td><strong style="color:#16a34a">${formatBDT(b.total_price)}</strong></td>
              <td><span class="badge ${badgeClass} badge-dot">${statusLabel}</span></td>
              <td style="font-size:.78rem;color:#6b7280">${formatDate(b.created_at)}</td>
            </tr>`;
        }).join('');
      }

    } catch (err) {
      console.error('Admin dashboard error:', err);
      document.getElementById('bookings-tbody').innerHTML = `
        <tr>
          <td colspan="6" style="text-align:center;padding:30px;color:#e53935">
            ⚠️ Failed to load data. Is the backend running?
          </td>
        </tr>`;
    }
  })();
</script>
</body>
</html>
