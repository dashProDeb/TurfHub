<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurfHub — Reports &amp; Analytics</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .mini-bar { height:70px;background:#e8ede8;border-radius:6px;position:relative;overflow:hidden;transition:height .3s; }
    .mini-bar-fill { position:absolute;bottom:0;left:0;right:0;background:#7ed321;border-radius:6px;transition:height .4s; }
    .bar-lbl { font-size:.68rem;color:#9ca3af;text-align:center;margin-top:4px; }
    .bar-val { font-size:.72rem;font-weight:700;color:#1a1a1a;text-align:center; }
    .report-row { display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f3f4f6; }
    .report-row:last-child { border-bottom:none; }
    .period-tab { padding:7px 18px;border-radius:100px;border:1.5px solid #e5e7eb;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;background:#fff;color:#6b7280;transition:all .15s; }
    .period-tab.active { background:#0d2818;border-color:#0d2818;color:#fff; }
  </style>
</head>
<body>
<div id="app-wrapper">
  <!-- Sidebar injected dynamically by layout.js -->

  <div id="main-content">
    <div id="topbar">
      <div class="topbar-title">
        <span class="topbar-heading">Reports &amp; Analytics</span>
        <span class="topbar-sub">Revenue, bookings, and performance insights</span>
      </div>
      <div class="topbar-actions">
        <button onclick="window.print()" class="btn-lime" style="font-size:.82rem;padding:7px 16px;cursor:pointer">
          📄 Export Statement (PDF)
        </button>
      </div>
    </div>
    
    <div class="page-body">
      <!-- Period filter tabs -->
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <button class="period-tab" onclick="setPeriod('week',this)">This Week</button>
        <button class="period-tab active" onclick="setPeriod('month',this)">This Month</button>
        <button class="period-tab" onclick="setPeriod('quarter',this)">Quarter</button>
        <button class="period-tab" onclick="setPeriod('year',this)">Year</button>
      </div>

      <!-- Stat cards -->
      <div class="stat-grid" style="margin-bottom:20px">
        <div class="stat-card">
          <div class="stat-icon" style="background:#dcfce7">📅</div>
          <div class="stat-body">
            <div class="stat-value" id="kpi-total-bookings">—</div>
            <div class="stat-label">Total Bookings</div>
            <div class="stat-trend up" id="kpi-confirmed-sub">Confirmed in period</div>
          </div>
        </div>
        
        <div class="stat-card">
          <div class="stat-icon" style="background:#dcfce7">💰</div>
          <div class="stat-body">
            <div class="stat-value" id="kpi-total-revenue">—</div>
            <div class="stat-label">Total Revenue</div>
            <div class="stat-trend up" id="kpi-net-payout">Net Disbursed</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background:#dbeafe">⏱️</div>
          <div class="stat-body">
            <div class="stat-value" id="kpi-utilization">—</div>
            <div class="stat-label">Avg Utilization</div>
            <div class="stat-trend up" id="kpi-active-turfs">Managed Venues</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background:#fef3c7">⭐</div>
          <div class="stat-body">
            <div class="stat-value" id="kpi-avg-rating">—</div>
            <div class="stat-label">Avg Rating</div>
            <div class="stat-trend up">Across all turfs</div>
          </div>
        </div>
      </div>

      <div class="content-grid">
        <!-- Revenue Chart (visual bar chart) -->
        <div class="content-panel">
          <div class="panel-header">
            <span class="panel-title">Revenue by Week</span>
            <span style="font-size:.78rem;color:#9ca3af" id="chart-subtitle">This Month</span>
          </div>
          
          <div id="revenue-bars-container" style="display:flex;align-items:flex-end;gap:12px;height:140px;padding:8px 0">
            <!-- Dynamically populated bars -->
          </div>

          <div style="margin-top:20px">
            <div class="panel-header"><span class="panel-title" style="font-size:.88rem">Revenue by Turf</span></div>
            <div id="turf-breakdown-list">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>

        <!-- Top customers & Peak hours -->
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="content-panel">
            <div class="panel-header"><span class="panel-title">Top Customers</span></div>
            <div id="top-customers-list">
              <!-- Dynamically populated -->
            </div>
          </div>
          
          <div class="content-panel">
            <div class="panel-header"><span class="panel-title">Peak Booking Hours</span></div>
            <div id="peak-hours-list">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

  <script src="api-client.js"></script>
  <script src="auth.js"></script>
  <script src="layout.js"></script>
  <script>
    let activePeriod = 'month';

    (async function init() {
      const user = await initAuth('owner');
      if (!user) return;
      renderSidebar('reports', user);

      await fetchAndRenderReports(activePeriod);
    })();

    async function setPeriod(p, btn) {
      document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activePeriod = p;
      await fetchAndRenderReports(p);
    }

    async function fetchAndRenderReports(period) {
      try {
        const data = await apiGet(`turfs/reports.php?period=${period}`);
        renderReports(data);
      } catch (err) {
        console.error('Failed to load owner reports:', err);
      }
    }

    function renderReports(data) {
      document.getElementById('chart-subtitle').textContent = data.period_label || 'Period Overview';

      // ── KPIs ──
      document.getElementById('kpi-total-bookings').textContent = data.total_bookings;
      document.getElementById('kpi-confirmed-sub').textContent = `↑ ${data.confirmed_bookings} confirmed`;
      document.getElementById('kpi-total-revenue').textContent = formatBDT(data.total_revenue);
      document.getElementById('kpi-net-payout').textContent = `↑ 95% Net: ${formatBDT(data.net_payout)}`;
      document.getElementById('kpi-utilization').textContent = `${data.utilization_rate}%`;
      document.getElementById('kpi-active-turfs').textContent = `${data.active_turfs} Managed Grounds`;
      document.getElementById('kpi-avg-rating').textContent = Number(data.avg_rating).toFixed(1);

      // ── Revenue Buckets ──
      renderRevenueBars(data.revenue_buckets || []);

      // ── Revenue by Turf ──
      renderTurfBreakdown(data.turf_breakdown || []);

      // ── Top Customers ──
      renderTopCustomers(data.top_customers || []);

      // ── Peak Hours ──
      renderPeakHours(data.peak_hours || {});
    }

    function renderRevenueBars(buckets) {
      const container = document.getElementById('revenue-bars-container');
      if (!buckets || buckets.length === 0) {
        container.innerHTML = `<div style="width:100%;text-align:center;color:#9ca3af;padding:20px;font-size:.85rem">No revenue in this period</div>`;
        return;
      }

      const maxAmount = Math.max(...buckets.map(b => b.amount), 1);

      container.innerHTML = buckets.map(b => {
        const pct = b.amount > 0 ? Math.max(15, Math.round((b.amount / maxAmount) * 100)) : 8;
        const fillStyle = b.amount > 0 ? `height:${pct}%;background:#7ed321` : `height:8%;background:#e5e7eb`;
        return `
          <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center">
            <div class="mini-bar" style="width:100%;height:100px"><div class="mini-bar-fill" style="${fillStyle}"></div></div>
            <div class="bar-lbl">${b.label}</div>
            <div class="bar-val">${formatBDT(b.amount)}</div>
          </div>`;
      }).join('');
    }

    function renderTurfBreakdown(turfs) {
      const listEl = document.getElementById('turf-breakdown-list');
      if (!turfs || turfs.length === 0) {
        listEl.innerHTML = `<div style="color:#9ca3af;font-size:.85rem;padding:10px 0">No turfs registered yet</div>`;
        return;
      }

      const colors = ['#7ed321', '#60a5fa', '#f59e0b', '#ec4899', '#8b5cf6'];

      listEl.innerHTML = turfs.map((turf, idx) => {
        const revenue = Number(turf.revenue || 0);
        const count = Number(turf.bookings_count || 0);
        const color = colors[idx % colors.length];

        return `
          <div class="report-row">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:10px;height:10px;border-radius:3px;background:${color}"></div>
              <span style="font-size:.85rem;font-weight:600">${turf.name}</span>
            </div>
            <div style="text-align:right">
              <div style="font-weight:800;font-size:.9rem">${formatBDT(revenue)}</div>
              <div style="font-size:.72rem;color:#9ca3af">${count} booking${count !== 1 ? 's' : ''}</div>
            </div>
          </div>`;
      }).join('');
    }

    function renderTopCustomers(customers) {
      const listEl = document.getElementById('top-customers-list');
      if (!customers || customers.length === 0) {
        listEl.innerHTML = `<div style="color:#9ca3af;font-size:.85rem;padding:10px 0">No customers in this period</div>`;
        return;
      }

      const avatarColors = [
        { bg: '#0d2818', text: '#7ed321' },
        { bg: '#6d28d9', text: '#fff' },
        { bg: '#dc2626', text: '#fff' },
        { bg: '#2563eb', text: '#fff' }
      ];

      listEl.innerHTML = customers.map((c, idx) => {
        const color = avatarColors[idx % avatarColors.length];
        const initial = (c.name || 'U').charAt(0).toUpperCase();
        const total = Number(c.total || 0);
        const count = Number(c.count || 0);

        return `
          <div class="report-row">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:32px;height:32px;border-radius:50%;background:${color.bg};color:${color.text};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem">
                ${initial}
              </div>
              <div>
                <span style="font-size:.85rem;font-weight:600">${c.name}</span>
                <span style="display:block;font-size:.72rem;color:#9ca3af">${count} booking${count > 1 ? 's' : ''}</span>
              </div>
            </div>
            <div style="font-weight:800;font-size:.88rem;color:#16a34a">${formatBDT(total)}</div>
          </div>`;
      }).join('');
    }

    function renderPeakHours(peak) {
      const listEl = document.getElementById('peak-hours-list');
      if (!peak || Object.keys(peak).length === 0) {
        listEl.innerHTML = `<div style="color:#9ca3af;font-size:.85rem;padding:10px 0">No slot data available</div>`;
        return;
      }

      const keys = ['morning', 'afternoon', 'evening', 'night'];
      const colors = ['#7ed321', '#7ed321', '#15803d', '#f59e0b'];

      listEl.innerHTML = keys.map((k, idx) => {
        const item = peak[k] || { label: k, percentage: 0, count: 0 };
        const color = colors[idx];
        const pct = item.percentage || 0;

        return `
          <div class="report-row">
            <span style="font-size:.85rem;color:#6b7280">${item.label}</span>
            <div style="width:100px;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:0 10px">
              <div style="width:${pct}%;height:100%;background:${color};border-radius:4px"></div>
            </div>
            <span style="font-size:.78rem;font-weight:700">${pct}%</span>
          </div>`;
      }).join('');
    }
  </script>
</body>
</html>
